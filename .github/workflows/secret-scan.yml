name: secret-scan

# Durable credential leak gate. Runs gitleaks on every push and PR, scanning the
# FULL git history (fetch-depth: 0) so a secret introduced in any commit — not
# just the tip — fails the build. Config: .gitleaks.toml (allowlists only the
# repo's deliberately-fake test fixtures).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action is free for public repos and personal accounts; no
          # GITLEAKS_LICENSE is required here. If this repo is ever moved under an
          # organization, set the GITLEAKS_LICENSE secret.
