[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-orchestrator"
version = "0.1.0"
description = "Advanced multi-agent CLI orchestrator: usage-aware allocation, cross-provider fallback, ToT + adversarial refinement, checkpointing, and session compaction."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
agy-orchestrator = "agy_orchestrator.cli:main"
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["agy_orchestrator*", "dashboard*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardening: release-blocking hardening invariants (XAUTH, killable tree, rlimits, redaction)",
    "fr: functional requirement tests per spec Testing Strategy",
    "slow: tests requiring live Xvfb + real components or longer timeouts; excluded from -m 'not slow'",
    "release_blocking: critical FR or hardening invariant tests (must pass for release)",
    "not_slow: tests suitable for the default -m 'not slow' gate (exclude heavy Xvfb or long-running)",
    "fr_release_blocking: one of FR-03/04/09/12/23/24",
    "realgui: real-GUI harness (real_act executor + ownership/ask/grant) tests; hermetic fakes by default, @slow + AGY_REALGUI_E2E=1 for zenity/:0 e2e",
    "browser: browser-controller and DOM-actuation tests (hermetic FakeBrowserController by default, @slow + AGY_BROWSER_E2E=1 for autonomous e2e)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enforced baseline: pyflakes (F), pycodestyle (E/W), import order (I), and
# F541 (empty f-strings). `ruff check` is clean against this set.
select = ["E", "F", "W", "I", "F541"]
ignore = ["E501"]  # long lines: wrap opportunistically, don't fail the build on them
# Opt-in extras (run `ruff check --extend-select G004` to also flag the ~19
# logging f-strings — a minor eager-eval style nit, left out of the gate).
