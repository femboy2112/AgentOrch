[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-orchestrator"
version = "0.1.0"
description = "Advanced multi-agent CLI orchestrator: usage-aware allocation, cross-provider fallback, ToT + adversarial refinement, checkpointing, and session compaction."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
agy-orchestrator = "agy_orchestrator.cli:main"
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["agy_orchestrator*", "dashboard*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Enforced baseline: pyflakes (F), pycodestyle (E/W), import order (I), and
# F541 (empty f-strings). `ruff check` is clean against this set.
select = ["E", "F", "W", "I", "F541"]
ignore = ["E501"]  # long lines: wrap opportunistically, don't fail the build on them
# Opt-in extras (run `ruff check --extend-select G004` to also flag the ~19
# logging f-strings — a minor eager-eval style nit, left out of the gate).
