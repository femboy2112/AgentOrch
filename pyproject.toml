[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-orchestrator"
version = "0.1.0"
description = "Advanced multi-agent CLI orchestrator: usage-aware allocation, cross-provider fallback, ToT + adversarial refinement, checkpointing, and session compaction."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
agy-orchestrator = "agy_orchestrator.cli:main"
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["agy_orchestrator*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pragmatic default set + a few quality lints surfaced by the audit:
# F541 (f-string w/o placeholders), G004 (f-string in logging), and the basics.
select = ["E", "F", "W", "I", "G004", "F541"]
ignore = ["E501"]  # long lines: wrap opportunistically, don't fail the build on them
